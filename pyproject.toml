[project]
name = "movement-smith"
version = "0.1.0"
description = "Text-to-animation for uploaded rigged GLB/FBX characters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
worker = [
  "modal>=0.73.0",
]

[project.scripts]
movement-smith = "movement_smith.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
